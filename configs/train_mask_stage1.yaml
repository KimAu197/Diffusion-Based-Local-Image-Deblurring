training:
  seed: 42
  split_seed: 2026
  image_size: 256
  max_steps: 2600
  validation_interval: 260
  validation_batches: 0
  batch_size: 8
  learning_rate: 0.0005
  weight_decay: 0.0001
  num_workers: 0
  output_dir: output/training/mask_stage1_coco20k_unet_rgb_2600s
  note: "Standalone Stage 1 mask prediction on user-provided data/COCO. The model input is Ib only."

data:
  train_manifest: data/COCO/train/manifest.json
  val_manifest: data/COCO/val/manifest.json

model:
  name: MaskPredictorUNet
  base_channels: 16
  input_features: rgb

losses:
  bce_weight: 1.0
  dice_weight: 1.0
  boundary_weight: 0.1
  positive_weight: 2.0
