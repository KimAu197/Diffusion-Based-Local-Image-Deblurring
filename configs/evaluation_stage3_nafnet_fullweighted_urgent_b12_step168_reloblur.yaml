evaluation:
  dry_run: false
  split: all
  image_size: 512
  visual_limit: 5

inference:
  prompt: local deblur restoration
  negative_prompt: null
  num_inference_steps: 50
  guidance_scale: 3.5
  strength: 0.3
  seed: 1234

data:
  manifest: output/datasets/reloblur_real/test_manifest.json

split:
  name: all
  split_seed: 42
  val_fraction: 0.1

model:
  type: sd_controlnet
  checkpoint: /root/autodl-tmp/project/output/training/stage3_nafnet_reloblur_fullweighted_urgent_b12_ft/checkpoint/step_000168/controlnet

nafnet_preprocess:
  enabled: true
  model_dir: /root/autodl-tmp/models/modelscope_nafnet/damo/cv_nafnet_image-deblur_gopro
  mask_blur_radius: 4.0
  cache_dir: output/cache/nafnet_stage3/infra_urgent_b12_step168_fullweighted

sd_controlnet:
  base_sd_checkpoint: /root/autodl-tmp/models/sd15-fp16
  controlnet_checkpoint: /root/autodl-tmp/project/output/training/stage3_nafnet_reloblur_fullweighted_urgent_b12_ft/checkpoint/step_000168/controlnet
  mask_head_checkpoint: null
  cache_dir: /root/autodl-tmp/cache/huggingface
  allow_downloads: false
  local_files_only: true
  dtype: float32
  precision: fp32
  variant: fp16
  image_size: 512
  mask_head_enabled: false
  mask_head_channels: 16

runtime:
  allow_downloads: false
  preserve_background: true
  output_predicted_mask: true
  use_gt_mask_as_input: false
  mask_predictor_checkpoint: /root/autodl-tmp/project/output/training/mask_stage1_coco20k_unet_rgb_2600s/best.pt
  mask_predictor_threshold: 0.55
  mask_predictor_input_features: rgb
