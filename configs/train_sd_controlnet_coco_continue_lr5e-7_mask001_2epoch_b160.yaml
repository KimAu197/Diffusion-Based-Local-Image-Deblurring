# Continue from phase1 continuation run with mask_loss_weight = 0.01 (was 0.1).

experiment:
  name: sd_controlnet_coco_continue_lr5e-7_mask001_2epoch_b160
  label: phase1_sd15_tile_controlnet_coco_continue_lr5e-7_mask001_2epoch_b160
  limitation: Continuation run with lower mask branch weight; initialize from completed lr5e-7 2epoch checkpoint.
  output_dir: output/training/phase1_sd15_tile_controlnet_coco_continue_lr5e-7_mask001_2epoch_b160
  seed: 42

data:
  manifest: output/datasets/coco2017_train_grouped_localblur_5k_plus_partial/manifest.json
  val_manifest: output/datasets/coco2017_val_grouped_localblur_5k/manifest.json
  dataset_name: coco2017_train_grouped_localblur_5k_plus_partial
  image_size: 256
  subset_train_count: 0
  subset_val_count: 0
  val_fraction: 0.1
  split_seed: 42
  num_workers: 0

sd_controlnet:
  base_sd_checkpoint: /root/autodl-tmp/models/sd15-fp16
  controlnet_init: from_pretrained
  controlnet_checkpoint: /root/autodl-tmp/project/output/training/phase1_sd15_tile_controlnet_coco_continue_lr5e-7_2epoch_b160/checkpoint/controlnet
  mask_head_checkpoint: /root/autodl-tmp/project/output/training/phase1_sd15_tile_controlnet_coco_continue_lr5e-7_2epoch_b160/checkpoint/aux_mask_head.pt
  cache_dir: /root/autodl-tmp/cache/huggingface
  allow_downloads: false
  local_files_only: true
  dtype: float32
  precision: fp32
  variant: fp16
  train_controlnet: true
  train_unet: false
  train_text_encoder: false
  train_vae: false
  mask_head_enabled: true
  mask_head_channels: 16

training:
  max_steps: null
  epochs: 2
  batch_size: 160
  learning_rate: 0.0000005
  gradient_accumulation_steps: 1
  validation_batches: 16
  validation_interval_steps: 50
  prompt: local deblur restoration
  diffusion_loss_weight: 1.0
  mask_loss_weight: 0.01
  mask_bce_weight: 1.0
  mask_dice_weight: 0.5
  save_controlnet: true
  checkpoint_steps: []
  checkpoint_interval_steps: 0
  checkpoint_mid_epoch: true
  checkpoint_at_epoch_end: true

wandb:
  enabled: true
  project: diffusion_blur
  entity: Columbia_project
  log_interval_steps: 1
